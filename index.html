/* ============================================================
   CHIP CLUB — styles.css
   Direction artistique : club privé de dégustation de chips.
   Palette : crème, jaune doré, orange légèrement brûlé,
   anthracite, blanc cassé. Moderne, premium, un peu fun.
   ============================================================ */

:root {
  --cream: #FBF4E6;
  --off-white: #FFFDF9;
  --gold: #E8B93F;
  --gold-deep: #C99A1F;
  --burnt-orange: #D9662B;
  --burnt-orange-deep: #B94F1D;
  --anthracite: #2B2A28;
  --anthracite-soft: #4A4744;
  --line: #E9DFC9;
  --success: #5C8A5C;
  --danger: #C0432E;
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 10px;
  --shadow-card: 0 4px 18px rgba(43, 42, 40, 0.08);
  --shadow-pop: 0 10px 30px rgba(43, 42, 40, 0.16);
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-display: "Outfit", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}


* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--cream);
  color: var(--anthracite);
  font-family: var(--font);
  -webkit-tap-highlight-color: transparent;
}
body {
  padding-bottom: 88px;
  min-height: 100vh;
}
button, input, select, textarea { font-family: var(--font); }

/* Police display : titres, grands chiffres, éléments d'emphase — moderne et géométrique */
h1, h2, h3,
.brand-title, .section-title, .form-section-title,
.stat-num, .avg-value, .reveal-note, .podium-note, .podium-brand,
.rank-note, .cc-note, .hof-note, .rate-value, .cd-title, .lc-title,
.bv.win, .titre-label, .taster-name, .profil-name, .profil-stats b,
.session-count, .ri-brand, .bh-name, .empty-card h3 {
  font-family: var(--font-display);
  letter-spacing: -0.01em;
}
a { color: inherit; }
::-webkit-scrollbar { display: none; }

#app { max-width: 560px; margin: 0 auto; }

.muted { color: var(--anthracite-soft); opacity: .65; font-size: 14px; }

/* ---------- Topbar ---------- */
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 18px 18px 14px;
  background: linear-gradient(180deg, var(--cream) 0%, var(--cream) 100%);
  position: sticky; top: 0; z-index: 20;
}
.iconbtn {
  width: 40px; height: 40px; border-radius: 50%;
  border: none; background: var(--off-white);
  box-shadow: var(--shadow-card);
  font-size: 18px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--anthracite); flex-shrink: 0;
}
.iconbtn:active { transform: scale(0.92); }
.brand { display: flex; flex-direction: column; }
.brand-title { font-weight: 800; font-size: 20px; letter-spacing: 0.3px; }
.brand-sub { font-size: 11.5px; color: var(--anthracite-soft); opacity: .7; margin-top: 1px; }

/* ---------- Page container ---------- */
.page { padding: 4px 18px 32px; }

.section-title {
  font-size: 15px; font-weight: 700; margin: 26px 0 12px;
  color: var(--anthracite);
}
.form-section-title {
  font-size: 15px; font-weight: 700; margin: 4px 0 14px;
  color: var(--burnt-orange-deep);
}

/* ---------- Cards ---------- */
.card {
  background: var(--off-white);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow-card);
  margin-bottom: 16px;
}
.empty-card { text-align: center; padding: 36px 24px; }
.empty-emoji { font-size: 48px; margin-bottom: 10px; }
.empty-card h3 { margin: 6px 0; }
.empty-card p { color: var(--anthracite-soft); font-size: 14px; margin-bottom: 18px; }

/* ---------- Buttons ---------- */
.btn {
  border: none; border-radius: 999px; font-weight: 600;
  padding: 13px 22px; font-size: 15px; cursor: pointer;
  transition: transform .1s ease, opacity .1s ease;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:active { transform: scale(0.97); }
.btn-block { width: 100%; margin-top: 10px; }
.btn-lg { padding: 15px 22px; font-size: 16px; }
.btn-small { padding: 9px 14px; font-size: 13px; }
.btn-primary {
  background: linear-gradient(135deg, var(--burnt-orange), var(--burnt-orange-deep));
  color: var(--off-white);
  box-shadow: 0 6px 16px rgba(185, 79, 29, 0.32);
}
.btn-secondary {
  background: var(--off-white); color: var(--anthracite);
  border: 1.5px solid var(--line);
}
.btn-ghost {
  background: transparent; color: var(--anthracite-soft);
  font-weight: 500;
}
.btn-danger {
  background: transparent; color: var(--danger);
  border: 1.5px solid rgba(192, 67, 46, 0.3);
}
.cta-row { display: flex; flex-direction: column; gap: 10px; margin: 18px 0 8px; }
.file-btn { cursor: pointer; }

/* ---------- Stat grid / dashboard ---------- */
.stat-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 10px; margin-top: 10px;
}
.stat-tile {
  background: var(--off-white); border-radius: var(--radius-md);
  padding: 16px; text-align: center; box-shadow: var(--shadow-card);
}
.stat-num { font-size: 26px; font-weight: 800; color: var(--burnt-orange-deep); }
.stat-label { font-size: 12px; color: var(--anthracite-soft); margin-top: 2px; }

.avg-banner {
  margin-top: 14px; padding: 20px;
  background: linear-gradient(135deg, var(--anthracite), #3a3835);
  border-radius: var(--radius-lg); color: var(--off-white);
  display: flex; align-items: center; justify-content: space-between;
}
.avg-label { font-size: 13px; opacity: .75; }
.avg-value { font-size: 30px; font-weight: 800; color: var(--gold); }
.avg-value span { font-size: 15px; opacity: .6; margin-left: 3px; }

/* ---------- Podium ---------- */
.podium {
  display: flex; align-items: flex-end; justify-content: center;
  gap: 8px; margin: 18px 0 6px;
}
.podium-col { flex: 1; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
.podium-medal { font-size: 26px; margin-bottom: 4px; }
.podium-card {
  background: var(--off-white); border-radius: 14px 14px 0 0;
  padding: 10px 8px; text-align: center; width: 100%;
  box-shadow: var(--shadow-card);
}
.podium-brand { font-weight: 700; font-size: 12.5px; }
.podium-flavor { font-size: 11px; color: var(--anthracite-soft); margin: 2px 0; }
.podium-note { font-weight: 800; color: var(--burnt-orange-deep); font-size: 15px; }
.podium-block { width: 100%; border-radius: 0 0 10px 10px; }
.podium-1 .podium-block { height: 70px; background: linear-gradient(180deg, var(--gold), var(--gold-deep)); }
.podium-2 .podium-block { height: 48px; background: linear-gradient(180deg, #C9C2B4, #A9A192); }
.podium-3 .podium-block { height: 34px; background: linear-gradient(180deg, #D8A874, #B98850); }

/* ---------- Hall of Fame tiles ---------- */
.hof-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 8px;
}
.hof-tile {
  background: var(--off-white); border-radius: var(--radius-md);
  padding: 14px; box-shadow: var(--shadow-card); cursor: pointer;
}
.hof-emoji { font-size: 22px; }
.hof-label { font-size: 12px; color: var(--anthracite-soft); margin: 4px 0 2px; }
.hof-name { font-size: 13px; font-weight: 600; }
.hof-note { font-size: 15px; font-weight: 800; color: var(--burnt-orange-deep); margin-top: 4px; }

/* ---------- Forms ---------- */
.field-label {
  display: block; font-size: 13px; font-weight: 600;
  margin: 16px 0 6px; color: var(--anthracite-soft);
}
.input {
  width: 100%; padding: 13px 14px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--line); background: var(--cream);
  font-size: 15px; color: var(--anthracite); outline: none;
}
.input:focus { border-color: var(--burnt-orange); }
.select-sm { padding: 10px 12px; font-size: 13px; }
.textarea { min-height: 90px; resize: vertical; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.price100g { font-size: 13px; color: var(--burnt-orange-deep); font-weight: 600; margin-top: 8px; }

.chip-select { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-opt {
  border: 1.5px solid var(--line); background: var(--cream);
  border-radius: 999px; padding: 9px 14px; font-size: 13.5px;
  cursor: pointer; color: var(--anthracite-soft);
}
.chip-opt.active {
  background: var(--burnt-orange); border-color: var(--burnt-orange);
  color: var(--off-white); font-weight: 600;
}
.inline-add { display: flex; gap: 8px; margin-top: 10px; }
.inline-add .input { flex: 1; }

.mode-select { display: flex; flex-direction: column; gap: 10px; }
.mode-opt {
  text-align: left; border: 1.5px solid var(--line); background: var(--cream);
  border-radius: var(--radius-md); padding: 13px 15px; cursor: pointer;
}
.mode-opt.active { border-color: var(--burnt-orange); background: #FBEADE; }
.mode-title { font-weight: 700; font-size: 14.5px; }
.mode-desc { font-size: 12.5px; color: var(--anthracite-soft); margin-top: 2px; }

.slider {
  width: 100%; -webkit-appearance: none; appearance: none;
  height: 6px; border-radius: 4px; background: var(--line); outline: none;
  margin-top: 6px;
}
.slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
  background: var(--burnt-orange); box-shadow: 0 2px 6px rgba(0,0,0,.25); cursor: pointer;
}
.slider.big::-webkit-slider-thumb { width: 28px; height: 28px; }
.slider::-moz-range-thumb {
  width: 22px; height: 22px; border-radius: 50%; border: none;
  background: var(--burnt-orange); cursor: pointer;
}
.slider-value { text-align: center; font-size: 13px; font-weight: 600; color: var(--burnt-orange-deep); margin-top: 6px; }

.photo-upload {
  height: 140px; border-radius: var(--radius-md); border: 2px dashed var(--line);
  display: flex; align-items: center; justify-content: center;
  color: var(--anthracite-soft); font-size: 13.5px; cursor: pointer;
  background: var(--cream); overflow: hidden;
}
.photo-upload img { width: 100%; height: 100%; object-fit: cover; }

/* ---------- Tasting session ---------- */
.session-card { text-align: center; }
.session-meta { display: flex; justify-content: center; gap: 10px; font-size: 12.5px; color: var(--anthracite-soft); flex-wrap: wrap; }
.badge {
  background: var(--line); border-radius: 999px; padding: 2px 10px; font-size: 11px; font-weight: 700;
}
.badge-blind { background: var(--anthracite); color: var(--gold); }
.session-count { font-size: 22px; font-weight: 800; margin-top: 8px; color: var(--burnt-orange-deep); }

.tasting-list { margin: 14px 0; }
.tasting-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px; background: var(--off-white); border-radius: var(--radius-sm);
  margin-bottom: 8px; box-shadow: var(--shadow-card);
}
.tr-name { font-size: 14px; font-weight: 600; }
.tr-note { font-weight: 800; color: var(--burnt-orange-deep); }

/* ---------- Progress bar / rating flow ---------- */
.progress-bar { height: 6px; background: var(--line); border-radius: 4px; margin: 4px 0 16px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--burnt-orange)); transition: width .3s ease; }

.chip-mini-card {
  background: var(--off-white); border-radius: var(--radius-md);
  padding: 12px 16px; text-align: center; margin-bottom: 14px; box-shadow: var(--shadow-card);
}
.chip-mini-card.blind { background: var(--anthracite); color: var(--gold); font-weight: 600; }
.cmc-brand { font-weight: 700; font-size: 14px; }
.cmc-flavor { font-size: 12.5px; color: var(--anthracite-soft); }

.rate-card { text-align: center; padding: 28px 20px; }
.rate-label { font-size: 19px; font-weight: 700; }
.rate-desc { font-size: 13px; color: var(--anthracite-soft); margin-top: 6px; }
.rate-value { font-size: 44px; font-weight: 800; color: var(--burnt-orange-deep); margin: 18px 0 4px; }

.option-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.option-grid.vertical { text-align: left; }
.option-btn {
  border: 1.5px solid var(--line); background: var(--cream); border-radius: var(--radius-md);
  padding: 14px 16px; font-size: 14.5px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; gap: 10px;
}
.option-btn:active { background: #FBEADE; border-color: var(--burnt-orange); }
.option-btn.active { background: #FBEADE; border-color: var(--burnt-orange); box-shadow: 0 0 0 1.5px var(--burnt-orange) inset; }
.opt-emoji { font-size: 20px; }

/* ---------- Édition d'une note ---------- */
.edit-crit-row { text-align: left; padding: 14px 0; border-bottom: 1px dashed var(--line); }
.edit-crit-row .rate-label { font-size: 15px; }
.edit-crit-row .rate-value { font-size: 24px; margin: 4px 0; }
.edit-crit-row:last-of-type { border: none; }

.note-list { margin-top: 4px; }
.note-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.note-row:last-child { border: none; }
.note-row-who { font-weight: 700; font-size: 13.5px; flex: 1; }
.note-row-score { font-weight: 700; color: var(--burnt-orange-deep); font-size: 14px; }

/* ---------- Reveal ---------- */
.reveal-card { text-align: center; padding: 30px 20px; }
.reveal-participants { text-align: left; margin-bottom: 18px; }
.rp-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13.5px; border-bottom: 1px dashed var(--line); }
.rp-row:last-child { border: none; }
.reveal-label { font-size: 13px; letter-spacing: 1.5px; color: var(--anthracite-soft); font-weight: 700; }
.reveal-note {
  font-family: var(--font-display); font-size: 64px; font-weight: 800; color: var(--burnt-orange-deep); letter-spacing: -0.02em;
  margin: 6px 0;
}
.reveal-note.small { font-size: 44px; }
.reveal-note span { font-size: 24px; opacity: .5; margin-left: 4px; }
.reveal-verdict { font-size: 17px; font-weight: 700; margin-bottom: 18px; }
.blind-box { margin: 10px 0; }
.blind-hidden { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--anthracite-soft); }
.reveal-identity { margin: 10px 0 18px; }
.ri-brand { font-size: 20px; font-weight: 800; }
.ri-flavor { font-size: 14px; color: var(--anthracite-soft); margin-top: 2px; }

.anim-pop { animation: pop .5s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { 0% { transform: scale(0.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.anim-fadein { animation: fadein .4s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.anim-fadeout { animation: fadeout .25s ease forwards; }
@keyframes fadeout { to { opacity: 0; } }

/* ---------- Lists / cards ---------- */
.list-card { cursor: pointer; }
.lc-title { font-weight: 700; font-size: 15.5px; }
.lc-sub { font-size: 12.5px; color: var(--anthracite-soft); margin-top: 3px; }

.recap-header { text-align: center; }
.recap-date { font-size: 13px; color: var(--anthracite-soft); }
.recap-stats { display: flex; justify-content: center; gap: 12px; font-size: 13px; font-weight: 600; margin-top: 6px; flex-wrap: wrap; }

/* ---------- Chips grid ---------- */
.chips-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 14px; }
.chip-card {
  background: var(--off-white); border-radius: var(--radius-md);
  overflow: hidden; box-shadow: var(--shadow-card); cursor: pointer;
}
.cc-photo {
  height: 100px; background: var(--cream); display: flex; align-items: center; justify-content: center; font-size: 34px;
}
.cc-photo img { width: 100%; height: 100%; object-fit: cover; }
.cc-body { padding: 10px 12px; }
.cc-brand { font-weight: 700; font-size: 13.5px; }
.cc-flavor { font-size: 12px; color: var(--anthracite-soft); }
.cc-note { font-weight: 800; color: var(--burnt-orange-deep); font-size: 13px; margin-top: 4px; }

/* ---------- Chip detail ---------- */
.chip-detail { text-align: center; }
.cd-photo { height: 160px; border-radius: var(--radius-md); background: var(--cream); display: flex; align-items: center; justify-content: center; font-size: 44px; overflow: hidden; margin-bottom: 14px; }
.cd-photo img { width: 100%; height: 100%; object-fit: cover; }
.cd-title { font-size: 19px; font-weight: 800; }
.cd-flavor { font-size: 13.5px; color: var(--anthracite-soft); margin-top: 2px; margin-bottom: 6px; }
.cd-actions { display: flex; justify-content: center; gap: 10px; margin: 10px 0 16px; flex-wrap: wrap; }

.criteria-bars { text-align: left; margin: 18px 0; }
.cbar-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.cbar-label { flex: 0 0 42%; font-size: 12.5px; color: var(--anthracite-soft); }
.cbar-track { flex: 1; height: 8px; background: var(--line); border-radius: 6px; overflow: hidden; }
.cbar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--burnt-orange)); }
.cbar-val { width: 32px; text-align: right; font-weight: 700; font-size: 12.5px; }

.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; margin-top: 16px; }
.info-grid div { background: var(--cream); border-radius: 10px; padding: 8px 10px; }
.info-grid span { display: block; font-size: 10.5px; color: var(--anthracite-soft); }
.info-grid b { font-size: 13px; }

.comment-row { text-align: left; font-size: 13.5px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.comment-row:last-child { border: none; }

/* ---------- Classement / Rank list ---------- */
.filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 4px; }
.rank-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.rank-row {
  display: flex; align-items: center; gap: 12px; background: var(--off-white);
  border-radius: var(--radius-sm); padding: 10px 12px; box-shadow: var(--shadow-card); cursor: pointer;
}
.rank-pos { width: 22px; text-align: center; font-weight: 800; color: var(--anthracite-soft); }
.rank-photo { width: 40px; height: 40px; border-radius: 10px; background: var(--cream); display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 18px; flex-shrink: 0; }
.rank-photo img { width: 100%; height: 100%; object-fit: cover; }
.rank-info { flex: 1; min-width: 0; }
.rank-brand { font-weight: 700; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank-flavor { font-size: 11.5px; color: var(--anthracite-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Dégustateurs ---------- */
.titres-list { display: flex; flex-direction: column; gap: 8px; }

.titre-label { font-weight: 700; font-size: 13.5px; }
.titre-name { font-size: 12px; color: var(--anthracite-soft); }

.tasters-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.taster-card { background: var(--off-white); border-radius: var(--radius-md); padding: 16px 8px; text-align: center; box-shadow: var(--shadow-card); cursor: pointer; }
.taster-avatar { font-size: 30px; }
.taster-name { font-weight: 700; font-size: 12.5px; margin-top: 4px; }

.profil-header { text-align: center; }
.profil-avatar { font-size: 44px; }
.profil-name { font-size: 19px; font-weight: 800; margin: 4px 0 14px; }
.profil-stats { display: flex; justify-content: space-around; margin-bottom: 16px; }
.profil-stats div { display: flex; flex-direction: column; }
.profil-stats b { font-size: 20px; color: var(--burnt-orange-deep); }
.profil-stats span { font-size: 11px; color: var(--anthracite-soft); }
.profil-prefs { text-align: left; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }

  return seuils[seuils.length - 1];

/* ---------- Helpers ---------- */
function uid(prefix) {
  return (prefix ? prefix + "_" : "") + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 9);
}

function findById(list, id) {
  return list.find((x) => x.id === id);
}

function labelOf(list, id, fallback) {
  const item = findById(list, id);
  return item ? item.label : (fallback || id || "—");
}

const TABLES = {
  degustateurs: "degustateurs", marques: "marques",
  saveursPerso: "saveurs_perso", famillesPerso: "familles_perso",

};

const Store = {
  _state: null,
  _client: null,
  _ready: false,
  _onChange: null, // callback appelé quand des données changent à distance

  /* ---------- Connexion + chargement initial ---------- */
  async init(onRemoteChange) {
    this._onChange = onRemoteChange || null;
    this._state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    this._client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    await this._fetchAll();
    if (!this._state.degustateurs.length) {
      await this._seedDefaultTasters();
      // Un autre appareil a peut-être semé les mêmes dégustateurs au même
      // instant (deux téléphones ouverts en même temps) : on recharge
      // depuis le serveur pour repartir de l'état réel, dédoublonné par
      // la contrainte unique côté base (voir migration SQL).
      await this._fetchAll();
    }
    this._subscribeRealtime();
    this._ready = true;
    return this._state;
  },

  async _fetchAll() {
    const c = this._client;
    const named = {
      degustateurs: c.from(TABLES.degustateurs).select("*"),
      marques: c.from(TABLES.marques).select("*"),
      saveursPerso: c.from(TABLES.saveursPerso).select("*"),
      famillesPerso: c.from(TABLES.famillesPerso).select("*"),
      soirees: c.from(TABLES.soirees).select("*"),
      chips: c.from(TABLES.chips).select("*"),
      degustations: c.from(TABLES.degustations).select("*"),
      notes: c.from(TABLES.notes).select("*"),
      settings: c.from("settings").select("*").eq("id", "global").maybeSingle()
    };
    const keys = Object.keys(named);
    const results = await Promise.all(keys.map((k) => named[k]));
    const byKey = {};
    keys.forEach((k, i) => { byKey[k] = results[i]; });

    // Si une seule requête échoue (table absente, permissions...), on le dit
    // clairement plutôt que de charger silencieusement un état vide.
    const errors = keys.filter((k) => byKey[k].error).map((k) => `${k} : ${byKey[k].error.message}`);
    if (errors.length) {
      throw new Error("Erreur Supabase — " + errors.join(" | "));
    }

    this._state.degustateurs = byKey.degustateurs.data || [];
    this._state.marques = byKey.marques.data || [];
    this._state.saveursPerso = byKey.saveursPerso.data || [];
    this._state.famillesPerso = byKey.famillesPerso.data || [];
    this._state.soirees = byKey.soirees.data || [];
    this._state.chips = byKey.chips.data || [];
    this._state.degustations = byKey.degustations.data || [];
    this._state.notes = byKey.notes.data || [];
    this._state.seuils = byKey.settings.data ? byKey.settings.data.seuils : null;
    this._state.settings = { demoLoaded: byKey.settings.data ? !!byKey.settings.data.demoLoaded : false };
  },

  async _refetchTable(key) {
    const table = TABLES[key];
    if (!table) return;
    const { data } = await this._client.from(table).select("*");
    this._state[key] = data || [];
  },

  _subscribeRealtime() {
    const c = this._client;
    const refresh = (key) => {
      // léger débounce : plusieurs events proches -> un seul refetch
      clearTimeout(this["_t_" + key]);
      this["_t_" + key] = setTimeout(async () => {
        await this._refetchTable(key);
        if (this._onChange) this._onChange();
      }, 250);
    };
    c.channel("chipclub-sync")
      .on("postgres_changes", { event: "*", schema: "public", table: TABLES.degustateurs }, () => refresh("degustateurs"))
      .on("postgres_changes", { event: "*", schema: "public", table: TABLES.marques }, () => refresh("marques"))
      .on("postgres_changes", { event: "*", schema: "public", table: TABLES.saveursPerso }, () => refresh("saveursPerso"))
      .on("postgres_changes", { event: "*", schema: "public", table: TABLES.famillesPerso }, () => refresh("famillesPerso"))
      .on("postgres_changes", { event: "*", schema: "public", table: TABLES.soirees }, () => refresh("soirees"))
      .on("postgres_changes", { event: "*", schema: "public", table: TABLES.chips }, () => refresh("chips"))
      .on("postgres_changes", { event: "*", schema: "public", table: TABLES.degustations }, () => refresh("degustations"))
      .on("postgres_changes", { event: "*", schema: "public", table: TABLES.notes }, () => refresh("notes"))
      .on("postgres_changes", { event: "*", schema: "public", table: "settings" }, async () => {
        clearTimeout(this._t_settings);
        this._t_settings = setTimeout(async () => {
          const { data } = await this._client.from("settings").select("*").eq("id", "global").maybeSingle();
          this._state.seuils = data ? data.seuils : null;
          this._state.settings = { demoLoaded: data ? !!data.demoLoaded : false };
          if (this._onChange) this._onChange();
        }, 250);
      })
      .subscribe();
  },

  _writeQueue: Promise.resolve(),

  _bg(factory, label) {
    // écriture en tâche de fond, mais mise en FILE D'ATTENTE stricte :
    // chaque écriture attend que la précédente soit confirmée par le
    // serveur avant de partir. Indispensable ici car certaines lignes
    // dépendent d'une autre qui vient d'être créée (ex : une dégustation
    // référence un paquet tout juste inséré) — sans cette file, les deux
    // requêtes réseau peuvent arriver dans le désordre et Postgres
    // refuse l'écriture (violation de clé étrangère).
    this._writeQueue = this._writeQueue.then(async () => {
      try {
        const { error } = await factory();
        if (error) {
          console.error("Erreur Supabase (" + label + ")", error);
          alert("⚠️ Écriture refusée par la base partagée (" + label + ") :\n" + error.message + "\n\nCette modification n'est peut-être pas sauvegardée pour les autres.");
        }
      } catch (e) {
        console.error("Erreur réseau Supabase (" + label + ")", e);
      }
    });
  },

  load() { return this._state; },

  async _seedDefaultTasters() {
    const rows = DEFAULT_TASTERS.map((t) => ({
      id: uid("taster"), nom: t.nom, avatarEmoji: t.avatarEmoji,
      isDemo: false, createdAt: new Date().toISOString()
    }));
    this._state.degustateurs.push(...rows);
    // upsert + ignoreDuplicates : si un autre appareil a déjà semé les
    // mêmes noms (contrainte unique sur "nom" côté base), cette écriture
    // ne crée pas de doublon plutôt que d'échouer.
    await this._client.from(TABLES.degustateurs).upsert(rows, { onConflict: "nom", ignoreDuplicates: true });
  },

  /* ---------- Dégustateurs ---------- */
  getDegustateurs() { return this._state.degustateurs; },
  addDegustateur(nom, avatarEmoji) {
    let existing = this._state.degustateurs.find((d) => d.nom.toLowerCase() === nom.toLowerCase());

    this._state.degustateurs.push(d);
    this._bg(() => this._client.from(TABLES.degustateurs).upsert([d], { onConflict: "nom", ignoreDuplicates: true }), "addDegustateur");
    return d;
  },
  getDegustateur(id) { return this._state.degustateurs.find((d) => d.id === id); },

  /* ---------- Marques ---------- */

  /* ---------- Saveurs personnalisées ---------- */
  addSaveurPerso(label, familleId) {

  getAllFamilles() { return FAMILLES.concat(this._state.famillesPerso); },

  /* ---------- Soirées ---------- */
  addSoiree(soiree) {
    const o = Object.assign({ id: uid("night"), isDemo: false, createdAt: new Date().toISOString() }, soiree);
    this._state.soirees.push(o);

  /* ---------- Chips (fiches produit) ---------- */
  addChip(chip) {
    const c = Object.assign({ id: uid("chip"), isDemo: false, createdAt: new Date().toISOString() }, chip);
    this._state.chips.push(c);

  },
  getChips() { return this._state.chips; },
  getChip(id) { return this._state.chips.find((c) => c.id === id); },
  updateChip(id, patch) {
    const c = this._state.chips.find((x) => x.id === id);
    if (!c) return null;
    Object.assign(c, patch);
    this._bg(() => this._client.from(TABLES.chips).update(patch).eq("id", id), "updateChip");
    return c;
  },
  // Supprime le paquet ainsi que sa/ses dégustation(s) et notes associées
  // (cascade gérée côté base, mais on nettoie aussi le cache local tout de suite).
  deleteChip(id) {
    const degIds = this._state.degustations.filter((d) => d.chipId === id).map((d) => d.id);
    this._state.chips = this._state.chips.filter((c) => c.id !== id);
    this._state.degustations = this._state.degustations.filter((d) => d.chipId !== id);
    this._state.notes = this._state.notes.filter((n) => !degIds.includes(n.degustationId));
    this._bg(() => this._client.from(TABLES.chips).delete().eq("id", id), "deleteChip");
  },

  /* ---------- Dégustations (chips x soirée) ---------- */
  addDegustation(deg) {
    const d = Object.assign({ id: uid("tasting"), revele: false, createdAt: new Date().toISOString() }, deg);
    this._state.degustations.push(d);
    this._bg(() => this._client.from(TABLES.degustations).insert([d]), "addDegustation");

  },
  getDegustations() { return this._state.degustations; },
  getDegustation(id) { return this._state.degustations.find((d) => d.id === id); },
  getDegustationsBySoiree(soireeId) { return this._state.degustations.filter((d) => d.soireeId === soireeId); },
  revelerDegustation(id) {
    const d = this._state.degustations.find((x) => x.id === id);
    if (d) {
      d.revele = true;
      this._bg(() => this._client.from(TABLES.degustations).update({ revele: true }).eq("id", id), "revelerDegustation");
    }
    return d;
  },
  // Supprime une dégustation (un "test" d'un paquet lors d'une soirée) et
  // ses notes, sans supprimer la fiche du paquet lui-même.
  deleteDegustation(id) {
    this._state.degustations = this._state.degustations.filter((d) => d.id !== id);
    this._state.notes = this._state.notes.filter((n) => n.degustationId !== id);
    this._bg(() => this._client.from(TABLES.degustations).delete().eq("id", id), "deleteDegustation");
  },

  /* ---------- Notes individuelles ---------- */
  addNote(note) {
    const n = Object.assign({ id: uid("note"), createdAt: new Date().toISOString() }, note);
    this._state.notes.push(n);
    this._bg(() => this._client.from(TABLES.notes).insert([n]), "addNote");

  },
  getNotes() { return this._state.notes; },
  getNote(id) { return this._state.notes.find((n) => n.id === id); },
  getNotesByDegustation(degustationId) { return this._state.notes.filter((n) => n.degustationId === degustationId); },
  getNotesByDegustateur(degustateurId) { return this._state.notes.filter((n) => n.degustateurId === degustateurId); },
  updateNote(id, patch) {
    const n = this._state.notes.find((x) => x.id === id);
    if (!n) return null;
    Object.assign(n, patch);
    this._bg(() => this._client.from(TABLES.notes).update(patch).eq("id", id), "updateNote");
    return n;
  },

  /* ---------- Seuils verdict ---------- */
  getSeuils() { return this._state.seuils && this._state.seuils.length ? this._state.seuils : SEUILS_VERDICT; },
  setSeuils(seuils) {
    this._state.seuils = seuils;
    this._bg(() => this._client.from("settings").upsert({ id: "global", seuils, demoLoaded: this._state.settings.demoLoaded }), "setSeuils");
  },

  /* ---------- Export / Import / Reset ---------- */
  exportJSON() { return JSON.stringify(this._state, null, 2); },
  async importJSON(json) {
    const parsed = JSON.parse(json);
    // Remplace les données locales ET les republie sur Supabase (upsert table par table)
    this._state = Object.assign({}, DEFAULT_STATE, parsed);
    const c = this._client;
    const ops = [];
    if (this._state.degustateurs.length) ops.push(c.from(TABLES.degustateurs).upsert(this._state.degustateurs));
    if (this._state.marques.length) ops.push(c.from(TABLES.marques).upsert(this._state.marques));
    if (this._state.saveursPerso.length) ops.push(c.from(TABLES.saveursPerso).upsert(this._state.saveursPerso));
    if (this._state.famillesPerso.length) ops.push(c.from(TABLES.famillesPerso).upsert(this._state.famillesPerso));
    if (this._state.soirees.length) ops.push(c.from(TABLES.soirees).upsert(this._state.soirees));
    if (this._state.chips.length) ops.push(c.from(TABLES.chips).upsert(this._state.chips));
    if (this._state.degustations.length) ops.push(c.from(TABLES.degustations).upsert(this._state.degustations));
    if (this._state.notes.length) ops.push(c.from(TABLES.notes).upsert(this._state.notes));
    ops.push(c.from("settings").upsert({ id: "global", seuils: this._state.seuils, demoLoaded: this._state.settings.demoLoaded }));
    await Promise.all(ops);
  },

  /* ---------- Démo ---------- */
  isDemoLoaded() { return !!this._state.settings.demoLoaded; },
  setDemoLoaded(v) {
    this._state.settings.demoLoaded = v;
    this._bg(() => this._client.from("settings").upsert({ id: "global", seuils: this._state.seuils, demoLoaded: v }), "setDemoLoaded");
  },
  async removeDemoData() {
    const s = this._state;
    const demoChipIds = s.chips.filter((c) => c.isDemo).map((c) => c.id);
    const demoSoireeIds = s.soirees.filter((so) => so.isDemo).map((so) => so.id);
    const demoDegIds = s.degustations.filter((d) => demoChipIds.includes(d.chipId) || demoSoireeIds.includes(d.soireeId)).map((d) => d.id);

    s.notes = s.notes.filter((n) => !demoDegIds.includes(n.degustationId));
    s.degustations = s.degustations.filter((d) => !demoDegIds.includes(d.id));
    s.chips = s.chips.filter((c) => !c.isDemo);
    s.soirees = s.soirees.filter((so) => !so.isDemo);
    s.degustateurs = s.degustateurs.filter((d) => !d.isDemo);
    s.settings.demoLoaded = false;

    const c = this._client;
    await Promise.all([
      demoDegIds.length ? c.from(TABLES.notes).delete().in("degustationId", demoDegIds) : null,
      demoDegIds.length ? c.from(TABLES.degustations).delete().in("id", demoDegIds) : null,
      demoChipIds.length ? c.from(TABLES.chips).delete().in("id", demoChipIds) : null,
      demoSoireeIds.length ? c.from(TABLES.soirees).delete().in("id", demoSoireeIds) : null,
      c.from(TABLES.degustateurs).delete().eq("isDemo", true),
      c.from("settings").upsert({ id: "global", seuils: s.seuils, demoLoaded: false })
    ].filter(Boolean));
  },

  async reset() {
    const c = this._client;
    const allIds = (arr) => arr.map((x) => x.id);
    await Promise.all([
      allIds(this._state.notes).length ? c.from(TABLES.notes).delete().in("id", allIds(this._state.notes)) : null,
      allIds(this._state.degustations).length ? c.from(TABLES.degustations).delete().in("id", allIds(this._state.degustations)) : null,
      allIds(this._state.chips).length ? c.from(TABLES.chips).delete().in("id", allIds(this._state.chips)) : null,
      allIds(this._state.soirees).length ? c.from(TABLES.soirees).delete().in("id", allIds(this._state.soirees)) : null,
      allIds(this._state.degustateurs).length ? c.from(TABLES.degustateurs).delete().in("id", allIds(this._state.degustateurs)) : null,
      allIds(this._state.marques).length ? c.from(TABLES.marques).delete().in("id", allIds(this._state.marques)) : null,
      allIds(this._state.saveursPerso).length ? c.from(TABLES.saveursPerso).delete().in("id", allIds(this._state.saveursPerso)) : null,
      allIds(this._state.famillesPerso).length ? c.from(TABLES.famillesPerso).delete().in("id", allIds(this._state.famillesPerso)) : null,
      c.from("settings").upsert({ id: "global", seuils: null, demoLoaded: false })
    ].filter(Boolean));
    this._state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    await this._seedDefaultTasters();
  }
};

const AVATAR_EMOJIS = ["🦊", "🐼", "🐸", "🐨", "🦁", "🐵", "🐺", "🦝", "🐯", "🐰", "🦄", "🐷"];
function pickAvatar(nom) {
  let hash = 0;
  for (let i = 0; i < nom.length; i++) hash = (hash * 31 + nom.charCodeAt(i)) % AVATAR_EMOJIS.length;
  return AVATAR_EMOJIS[Math.abs(hash) % AVATAR_EMOJIS.length];
}


/* ===== calc.js ===== */
/* ============================================================
   CHIP CLUB — calc.js
   Toutes les fonctions de calcul : moyennes, classement,
   hall of fame, profils, stats, chip battle.
   Rien ici ne touche au DOM.
   ============================================================ */

const Calc = {

  /* Moyenne d'un critère pour une dégustation donnée (toutes notes confondues) */
  degustationCriteriaAvg(degustationId, critereId) {
    const notes = Store.getNotesByDegustation(degustationId);
    if (!notes.length) return null;
    const vals = notes.map((n) => n.criteres[critereId]).filter((v) => v != null);
    if (!vals.length) return null;
    return vals.reduce((a, b) => a + b, 0) / vals.length;
  },

  /* Note globale d'une dégustation = moyenne des moyennes-participant sur GOUT
     mais la "Note Chip Club" spec = moyenne des moyennes-participants (moyenne
     de la moyenne globale /10 par participant, calculée sur l'ensemble des critères) */
  degustateurMoyenne(degustationId, degustateurId) {
    const notes = Store.getNotesByDegustation(degustationId).filter((n) => n.degustateurId === degustateurId);
    if (!notes.length) return null;
    // moyenne de tous les critères pour ce participant sur cette dégustation (normalement 1 note)
    const n = notes[notes.length - 1];
    const vals = CRITERES.map((c) => n.criteres[c.id]).filter((v) => v != null);
    if (!vals.length) return null;
    return vals.reduce((a, b) => a + b, 0) / vals.length;
  },

  /* Note Chip Club = moyenne des moyennes de chaque dégustateur */
  noteChipClub(degustationId) {
    const notes = Store.getNotesByDegustation(degustationId);
    if (!notes.length) return null;
    const ids = [...new Set(notes.map((n) => n.degustateurId))];
    const moyennes = ids.map((id) => this.degustateurMoyenne(degustationId, id)).filter((v) => v != null);
    if (!moyennes.length) return null;
    return moyennes.reduce((a, b) => a + b, 0) / moyennes.length;
  },

  /* Écart-type simple des moyennes participants -> indicateur "controverse" */
  ecartControverse(degustationId) {
    const notes = Store.getNotesByDegustation(degustationId);
    const ids = [...new Set(notes.map((n) => n.degustateurId))];
    const moyennes = ids.map((id) => this.degustateurMoyenne(degustationId, id)).filter((v) => v != null);
    if (moyennes.length < 2) return 0;
    return Math.max(...moyennes) - Math.min(...moyennes);
  },

  /* Prix / 100g pour une chip */
  prixPour100g(chip) {
    const prix = parseFloat(chip.prix);
    const poids = parseFloat(chip.poids);
    if (!prix || !poids) return null;
    return (prix / poids) * 100;
  },

  /* Construit une "row" enrichie pour une dégustation donnée (utilisée partout) */
  buildRow(degustation) {
    const chip = Store.getChip(degustation.chipId);
    if (!chip) return null;
    const note = this.noteChipClub(degustation.id);
    const row = {
      degustation, chip,
      note,
      verdict: getVerdict(note),
      controverse: this.ecartControverse(degustation.id),
      prix100g: this.prixPour100g(chip)
    };
    for (const c of CRITERES) {
      row[c.id] = this.degustationCriteriaAvg(degustation.id, c.id);
    }
    return row;
  },

  allRows() {
    return Store.getDegustations()
      .map((d) => this.buildRow(d))
      .filter((r) => r && r.note != null);
  },

  /* ---------- Classement / filtres ---------- */
  classement(sortKey = "note", famille = null, marque = null, familleSaveur = null) {
    let rows = this.allRows();
    if (famille) rows = rows.filter((r) => r.chip.familleId === famille);
    if (marque) rows = rows.filter((r) => r.chip.marque === marque);
    if (familleSaveur) rows = rows.filter((r) => r.chip.saveurFamilleId === familleSaveur);
    rows.sort((a, b) => {
      if (sortKey === "prix100g") return (a.prix100g ?? 1e9) - (b.prix100g ?? 1e9);
      if (sortKey === "date") return new Date(b.chip.createdAt) - new Date(a.chip.createdAt);
      if (sortKey === "piquant") return (b.chip.piquant || 0) - (a.chip.piquant || 0);
      const av = a[sortKey], bv = b[sortKey];
      return (bv ?? -1) - (av ?? -1);
    });
    return rows;
  },

  /* ---------- Hall of Fame ---------- */
  hallOfFame() {
    const rows = this.allRows();
    if (!rows.length) return null;
    const best = (key) => rows.slice().sort((a, b) => (b[key] ?? -1) - (a[key] ?? -1))[0];
    const worst = (key) => rows.slice().sort((a, b) => (a[key] ?? 999) - (b[key] ?? 999))[0];
    const withPrix = rows.filter((r) => r.prix100g != null);
    const bestValue = withPrix.length
      ? withPrix.slice().sort((a, b) => (b.note / b.prix100g) - (a.note / a.prix100g))[0]
      : null;
    return {
      meilleure: best("note"),
      pire: worst("note"),
      addictive: best("addictivite"),
      originale: best("originalite"),
      qualitePrix: bestValue,
      meilleurGout: best("gout"),
      meilleureTexture: best("texture"),
      plusFidele: best("fidelite"),
      plusPiquante: rows.slice().sort((a, b) => (b.chip.piquant || 0) - (a.chip.piquant || 0))[0],
      controversee: rows.slice().sort((a, b) => b.controverse - a.controverse)[0]
    };
  },

  /* ---------- Profil dégustateur ---------- */
  profil(degustateurId) {
    const allNotes = Store.getNotesByDegustateur(degustateurId);
    if (!allNotes.length) return null;
    const rows = allNotes.map((n) => {
      const deg = Store.getDegustation(n.degustationId);
      const chip = deg ? Store.getChip(deg.chipId) : null;
      if (!chip) return null;
      const vals = CRITERES.map((c) => n.criteres[c.id]).filter((v) => v != null);
      const moyenne = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
      return { note: n, deg, chip, moyenne };
    }).filter(Boolean);

    const nbChips = rows.length;
    const moyenneDonnee = rows.reduce((a, r) => a + (r.moyenne || 0), 0) / nbChips;

    const parSaveur = {};
    const parFamille = {};
    const parMarque = {};
    for (const r of rows) {
      const sav = r.chip.saveurLabel || "?";
      parSaveur[sav] = parSaveur[sav] || [];
      parSaveur[sav].push(r.moyenne);
      const fam = labelOf(Store.getAllFamilles(), r.chip.familleId);
      parFamille[fam] = parFamille[fam] || [];
      parFamille[fam].push(r.moyenne);
      const marque = r.chip.marque || "?";
      parMarque[marque] = parMarque[marque] || [];
      parMarque[marque].push(r.moyenne);
    }
    const avgMap = (map) => Object.entries(map).map(([k, v]) => ({ label: k, avg: v.reduce((a, b) => a + b, 0) / v.length, n: v.length }));
    const saveurPref = avgMap(parSaveur).sort((a, b) => b.avg - a.avg)[0];
    const saveurMoins = avgMap(parSaveur).sort((a, b) => a.avg - b.avg)[0];
    const famillePref = avgMap(parFamille).sort((a, b) => b.avg - a.avg)[0];
    const marquesPref = avgMap(parMarque).sort((a, b) => b.avg - a.avg).slice(0, 5);
    const saveursPref = avgMap(parSaveur).sort((a, b) => b.avg - a.avg).slice(0, 5);

    const racheteOui = rows.filter((r) => r.note.racheter === "oui").length;
    const tauxRachat = nbChips ? (racheteOui / nbChips) * 100 : 0;

    const top5 = rows.slice().sort((a, b) => b.moyenne - a.moyenne).slice(0, 5);
    const flop5 = rows.slice().sort((a, b) => a.moyenne - b.moyenne).slice(0, 5);

    return {
      degustateur: Store.getDegustateur(degustateurId),
      nbChips, moyenneDonnee, saveurPref, saveurMoins, famillePref,
      marquesPref, saveursPref, tauxRachat, top5, flop5
    };
  },

  /* Titres automatiques entre dégustateurs */
  titres() {
    const degustateurs = Store.getDegustateurs();
    const profils = degustateurs.map((d) => this.profil(d.id)).filter(Boolean);
    if (profils.length < 2) return [];
    const titres = [];
    const genereux = profils.slice().sort((a, b) => b.moyenneDonnee - a.moyenneDonnee)[0];
    titres.push({ emoji: "😇", label: "Le plus généreux", degustateur: genereux.degustateur, detail: genereux.moyenneDonnee.toFixed(1) });
    const critique = profils.slice().sort((a, b) => a.moyenneDonnee - b.moyenneDonnee)[0];
    titres.push({ emoji: "🧐", label: "Le critique gastronomique", degustateur: critique.degustateur, detail: critique.moyenneDonnee.toFixed(1) });

    // opposant : le plus souvent en désaccord avec la moyenne du groupe
    const ecarts = {};
    for (const d of degustateurs) ecarts[d.id] = [];
    for (const deg of Store.getDegustations()) {
      const note = this.noteChipClub(deg.id);
      if (note == null) continue;
      for (const n of Store.getNotesByDegustation(deg.id)) {
        const m = this.degustateurMoyenne(deg.id, n.degustateurId);
        if (m != null) ecarts[n.degustateurId] && ecarts[n.degustateurId].push(Math.abs(m - note));
      }
    }
    const ecartsAvg = Object.entries(ecarts).filter(([, v]) => v.length).map(([id, v]) => ({ id, avg: v.reduce((a, b) => a + b, 0) / v.length }));
    if (ecartsAvg.length) {
      const opposant = ecartsAvg.sort((a, b) => b.avg - a.avg)[0];
      titres.push({ emoji: "⚔️", label: "L'opposant", degustateur: Store.getDegustateur(opposant.id), detail: "±" + opposant.avg.toFixed(1) });
    }

    const acheteur = profils.slice().sort((a, b) => b.tauxRachat - a.tauxRachat)[0];
    titres.push({ emoji: "🛒", label: "L'acheteur compulsif", degustateur: acheteur.degustateur, detail: Math.round(acheteur.tauxRachat) + "%" });

    // plus facile à rendre accro : moyenne addictivité la plus élevée donnée
    const addictAvg = degustateurs.map((d) => {
      const notes = Store.getNotesByDegustateur(d.id);
      const vals = notes.map((n) => n.criteres.addictivite).filter((v) => v != null);
      return { d, avg: vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null };
    }).filter((x) => x.avg != null);
    if (addictAvg.length) {
      const accro = addictAvg.sort((a, b) => b.avg - a.avg)[0];
      titres.push({ emoji: "🔥", label: "Le plus facile à rendre accro", degustateur: accro.d, detail: accro.avg.toFixed(1) });
    }
    return titres;
  },

  /* ---------- Récap de soirée ---------- */
  recapSoiree(soireeId) {
    const soiree = Store.getSoiree(soireeId);
    if (!soiree) return null;
    const degs = Store.getDegustationsBySoiree(soireeId);
    const rows = degs.map((d) => this.buildRow(d)).filter((r) => r && r.note != null);
    const poidsTotal = rows.reduce((a, r) => a + (parseFloat(r.chip.poids) || 0), 0);
    const sorted = rows.slice().sort((a, b) => b.note - a.note);
    return {
      soiree, rows,
      nbParticipants: (soiree.participantsIds || []).length,
      nbPaquets: rows.length,
      poidsTotalKg: poidsTotal / 1000,
      gagnante: sorted[0],
      deuxieme: sorted[1],
      troisieme: sorted[2],
      accident: sorted[sorted.length - 1],
      addictive: rows.slice().sort((a, b) => (b.addictivite ?? -1) - (a.addictivite ?? -1))[0],
      surprenante: rows.slice().sort((a, b) => (b.originalite ?? -1) - (a.originalite ?? -1))[0],
      debat: rows.slice().sort((a, b) => b.controverse - a.controverse)[0],
      qualitePrix: rows.filter((r) => r.prix100g).sort((a, b) => (b.note / b.prix100g) - (a.note / a.prix100g))[0]
    };
  },

  /* ---------- Statistiques globales ---------- */
  statsGlobales() {
    const chips = Store.getChips();
    const rows = this.allRows();
    const soirees = Store.getSoirees();
    const marquesSet = new Set(chips.map((c) => c.marque).filter(Boolean));
    const saveursSet = new Set(chips.map((c) => c.saveurId).filter(Boolean));
    const budgetTotal = chips.reduce((a, c) => a + (parseFloat(c.prix) || 0), 0);
    const poidsTotal = chips.reduce((a, c) => a + (parseFloat(c.poids) || 0), 0);
    const prixMoyen = chips.length ? budgetTotal / chips.length : 0;
    const noteMoyenne = rows.length ? rows.reduce((a, r) => a + r.note, 0) / rows.length : null;

    const groupAvg = (keyFn) => {
      const map = {};
      for (const r of rows) {
        const k = keyFn(r);
        if (!k) continue;
        map[k] = map[k] || [];
        map[k].push(r.note);
      }
      return Object.entries(map).map(([k, v]) => ({ label: k, avg: v.reduce((a, b) => a + b, 0) / v.length, n: v.length }));
    };

    const parMarque = groupAvg((r) => r.chip.marque).sort((a, b) => b.avg - a.avg);
    const parFamilleSaveur = groupAvg((r) => labelOf(FAMILLES_SAVEUR, r.chip.saveurFamilleId)).sort((a, b) => b.avg - a.avg);
    const parFamille = groupAvg((r) => labelOf(Store.getAllFamilles(), r.chip.familleId)).sort((a, b) => b.avg - a.avg);
    const parSaveur = groupAvg((r) => r.chip.saveurLabel).sort((a, b) => b.avg - a.avg);
    const parMagasin = groupAvg((r) => r.chip.magasin).sort((a, b) => b.avg - a.avg);

    return {
      nbChips: chips.length, nbMarques: marquesSet.size, nbSaveurs: saveursSet.size,
      nbSoirees: soirees.length, budgetTotal, poidsTotal, prixMoyen, noteMoyenne,
      parMarque, parFamilleSaveur, parFamille, parSaveur, parMagasin,
      saveurPreferee: parSaveur[0], familleSaveurPreferee: parFamilleSaveur[0],
      famillePreferee: parFamille[0], marquePreferee: parMarque[0],
      saveurMoinsAimee: parSaveur.slice().sort((a, b) => a.avg - b.avg)[0],
      meilleurMagasin: parMagasin[0],
      rows
    };
  },

  /* Phrases fun générées seulement si calculables */
  phrasesFun() {
    const phrases = [];
    const stats = this.statsGlobales();
    if (stats.poidsTotal > 0) {
      phrases.push(`Vous avez dégusté ${(stats.poidsTotal / 1000).toFixed(1)} kg de chips.`);
    }
    if (stats.budgetTotal > 0) {
      phrases.push(`Vous avez dépensé ${stats.budgetTotal.toFixed(2)} € pour la science.`);
    }
    const bbq = stats.parFamilleSaveur.find((f) => f.label === "Barbecue / fumé");
    const vin = stats.parFamilleSaveur.find((f) => f.label === "Vinaigre / acidulé");
    if (bbq && vin) {
      const diff = bbq.avg - vin.avg;
      phrases.push(`Le barbecue obtient en moyenne ${Math.abs(diff).toFixed(1)} point${Math.abs(diff) >= 2 ? "s" : ""} ${diff >= 0 ? "de plus" : "de moins"} que le vinaigre.`);
    }
    for (const d of Store.getDegustateurs()) {
      const notes = Store.getNotesByDegustateur(d.id);
      if (notes.length < 3) continue;
      const vals = notes.map((n) => {
        const vs = CRITERES.map((c) => n.criteres[c.id]).filter((v) => v != null);
        return vs.length ? vs.reduce((a, b) => a + b, 0) / vs.length : null;
      }).filter((v) => v != null);
      if (!vals.length || stats.noteMoyenne == null) continue;
      const perso = vals.reduce((a, b) => a + b, 0) / vals.length;
      const diff = perso - stats.noteMoyenne;
      if (Math.abs(diff) >= 0.3) {
        phrases.push(`${d.nom} note en moyenne ${Math.abs(diff).toFixed(1)} point ${diff < 0 ? "plus sévèrement" : "plus généreusement"} que le groupe.`);
      }
    }
    const rows = stats.rows;
    const plus8 = rows.filter((r) => r.note > 8);
    if (plus8.length >= 3) {
      const notesAvecRachat = plus8.filter((r) => {
        const notes = Store.getNotesByDegustation(r.degustation.id);
        return notes.some((n) => n.racheter === "oui");
      });
      const pct = (notesAvecRachat.length / plus8.length) * 100;
      phrases.push(`${Math.round(pct)} % des chips notées plus de 8/10 ont été rachetées.`);
    }
    return phrases;
  },

  /* ---------- Chip Battle ---------- */
  battleRow(chipId) {
    const deg = Store.getDegustations().find((d) => d.chipId === chipId);
    if (!deg) return null;
    return this.buildRow(deg);
  }
};

function daysAgo(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.toISOString().slice(0, 10);
}
